<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9bb8c">
<title>Mapa Los</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#1e1610;--panel:rgba(34,25,18,.9);--line:#4a3a2c;--text:#f1e3c4;--dim:#b49e7c;--gold:#e8b13a;--wp:#d63a2a;--blue:#8aa6a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
.hud{position:absolute;z-index:5;pointer-events:none}
.top{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;pointer-events:auto}
.top input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);font:600 18px inherit;font-family:inherit;padding:12px 14px;border-radius:4px;outline:none;letter-spacing:.03em}
.top input:focus{border-color:var(--gold)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:inherit;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:0 14px;border-radius:4px;min-height:46px}
.btn:active{background:#222d36}
.btn.on{border-color:var(--gold);color:var(--gold)}
#results{position:absolute;z-index:6;top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));background:var(--panel);border:1px solid var(--line);border-radius:4px;max-height:40%;overflow:auto}
#results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:600 17px inherit;font-family:inherit;padding:12px 14px}
#results button:last-child{border:0}
.side{right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.side .btn{width:48px;padding:0;font-size:22px}
.bottom{left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:none}
#speed{background:var(--panel);border:2px solid var(--line);border-radius:50%;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
#speed b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#speed i{font-style:normal;font-size:12px;color:var(--dim);letter-spacing:.1em}
#nav{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--wp);border-radius:4px;padding:10px 12px;pointer-events:auto;display:none}
#nav .step{font-size:22px;font-weight:700;line-height:1.1;text-wrap:balance}
#nav .meta{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:16px;margin-top:6px;font-variant-numeric:tabular-nums}
#nav .meta b{color:var(--text)}
#nav .row{display:flex;gap:8px;margin-top:8px}
#nav .row .btn{min-height:38px;font-size:15px;flex:1}
#hint{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 100px);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:4px;font-size:15px;color:var(--dim);pointer-events:none;text-align:center;max-width:90%}
.me{width:34px;height:34px;transition:transform .2s}
.me svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.wp{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--wp);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>

<div class="hud top">
  <input id="q" type="search" placeholder="Szukaj miejsca (v4)" autocomplete="off" enterkeyhint="search">
  <button class="btn" id="go">Szukaj</button>
</div>
<div id="results" hidden></div>

<div class="hud side">
  <button class="btn on" id="follow" title="Śledź mnie">◎</button>
  <button class="btn" id="tilt" title="Widok 3D">3D</button>
  <button class="btn" id="north" title="Północ">N</button>
</div>

<div id="hint">Przytrzymaj mapę, aby ustawić cel</div>

<div class="hud bottom">
  <div id="speed"><b id="spd">0</b><i>KM/H</i></div>
  <div id="nav">
    <div class="step" id="step">—</div>
    <div class="meta"><span><b id="dist">—</b> do celu</span><span><b id="eta">—</b></span></div>
    <div class="row"><button class="btn" id="voice">Głos: wł.</button><button class="btn" id="cancel">Anuluj trasę</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
window.onerror=function(m,u,l){var h=document.getElementById('hint');if(h){h.style.display='';h.textContent='Błąd: '+m+' (linia '+l+')'}};
// Styl mapy: paleta inspirowana mapą z gier open-world (własna, nie kopia grafiki)
var C={water:'#8aa6a3',land:'#d9bb8c',park:'#cdb07a',wood:'#c2a56f',urban:'#d3b283',build:'#c9a574',
  roadMinor:'#6b5239',roadMajor:'#4a3a2c',roadCase:'#2a2018',motor:'#2a2018',rail:'#8a6f4d',text:'#3a2a1c',halo:'#e6cfa4',wp:'#d63a2a',outline:'#5a4632'};
var FONT=['Noto Sans Regular'],FONTB=['Noto Sans Bold'];
var style={version:8,
 glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
 sources:{omt:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},
 layers:[
  {id:'bg',type:'background',paint:{'background-color':C.land}},
  {id:'landuse',type:'fill',source:'omt','source-layer':'landuse',filter:['in','class','residential','commercial','industrial','retail'],paint:{'fill-color':C.urban}},
  {id:'park',type:'fill',source:'omt','source-layer':'landcover',filter:['in','class','grass','farmland'],paint:{'fill-color':C.park}},
  {id:'wood',type:'fill',source:'omt','source-layer':'landcover',filter:['==','class','wood'],paint:{'fill-color':C.wood}},
  {id:'parks2',type:'fill',source:'omt','source-layer':'park',paint:{'fill-color':C.park}},
  {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':C.water}},
  {id:'waterway',type:'line',source:'omt','source-layer':'waterway',paint:{'line-color':C.water,'line-width':1.5}},
  {id:'rail',type:'line',source:'omt','source-layer':'transportation',filter:['==','class','rail'],minzoom:12,paint:{'line-color':C.rail,'line-width':1,'line-dasharray':[3,3]}},
  {id:'road-case',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','motorway','trunk','primary','secondary','tertiary','minor','service'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.roadCase,'line-width':['interpolate',['exponential',1.5],['zoom'],8,0.6,14,['match',['get','class'],['motorway','trunk'],8,['primary','secondary'],6,3.5],18,['match',['get','class'],['motorway','trunk'],30,['primary','secondary'],22,12]]}},
  {id:'road-minor',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','tertiary','minor','service'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.roadMinor,'line-width':['interpolate',['exponential',1.5],['zoom'],12,0.5,14,2.2,18,10]}},
  {id:'road-major',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','primary','secondary'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.roadMajor,'line-width':['interpolate',['exponential',1.5],['zoom'],8,0.5,14,4.5,18,19]}},
  {id:'road-motor',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','motorway','trunk'],layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':C.motor,'line-width':['interpolate',['exponential',1.5],['zoom'],6,0.8,14,6,18,26]}},
  {id:'building',type:'fill-extrusion',source:'omt','source-layer':'building',minzoom:14,
    paint:{'fill-extrusion-color':C.build,'fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.85}},
  {id:'road-name',type:'symbol',source:'omt','source-layer':'transportation_name',minzoom:14,layout:{'symbol-placement':'line','text-field':['coalesce',['get','name:pl'],['get','name']],'text-font':FONT,'text-size':12},paint:{'text-color':C.text,'text-halo-color':C.halo,'text-halo-width':1.6}},
  {id:'water-name',type:'symbol',source:'omt','source-layer':'water_name',layout:{'text-field':['coalesce',['get','name:pl'],['get','name']],'text-font':FONT,'text-size':13,'text-letter-spacing':.2},paint:{'text-color':'#fff','text-halo-color':C.water,'text-halo-width':1.5}},
  {id:'place-small',type:'symbol',source:'omt','source-layer':'place',filter:['in','class','suburb','neighbourhood','village','town'],layout:{'text-field':['coalesce',['get','name:pl'],['get','name']],'text-font':FONTB,'text-size':['interpolate',['linear'],['zoom'],8,11,14,16],'text-transform':'uppercase','text-letter-spacing':.08},paint:{'text-color':C.text,'text-halo-color':C.halo,'text-halo-width':1.8}},
  {id:'place-city',type:'symbol',source:'omt','source-layer':'place',filter:['in','class','city','state'],layout:{'text-field':['coalesce',['get','name:pl'],['get','name']],'text-font':FONTB,'text-size':['interpolate',['linear'],['zoom'],4,13,12,24],'text-transform':'uppercase','text-letter-spacing':.1},paint:{'text-color':C.text,'text-halo-color':C.halo,'text-halo-width':2}}
 ]};

var map=null;
function recolor(st){
  st.layers.forEach(function(l){
    var id=l.id.toLowerCase(),p=l.paint=l.paint||{};
    if(l.type==='background'){p['background-color']=C.land;return}
    if(l.type==='fill'){
      var c=C.urban;
      if(/water/.test(id))c=C.water;
      else if(/wood|forest/.test(id))c=C.wood;
      else if(/park|grass|green|cemetery|pitch|golf|garden|landcover|farm/.test(id))c=C.park;
      else if(/building/.test(id))c=C.build;
      else if(/aeroway|airport|runway/.test(id))c='#c8a878';
      else if(/ice|glacier|sand|rock/.test(id))c=C.land;
      p['fill-color']=c;delete p['fill-pattern'];
      if(/building/.test(id)){p['fill-opacity']=1;p['fill-outline-color']=C.outline}
    }else if(l.type==='fill-extrusion'){
      p['fill-extrusion-color']=C.build;p['fill-extrusion-opacity']=.85;
    }else if(l.type==='line'){
      if(/water/.test(id))p['line-color']=C.water;
      else if(/rail|transit/.test(id))p['line-color']=C.rail;
      else if(/boundary|admin/.test(id))p['line-color']='#8a6f4d';
      else if(/(casing|case|bridge_.*casing|tunnel_.*casing)/.test(id))p['line-color']=C.roadCase;
      else if(/motorway|trunk/.test(id))p['line-color']=C.motor;
      else if(/primary|secondary/.test(id))p['line-color']=C.roadMajor;
      else if(/road|street|path|tertiary|minor|service|link|bridge|tunnel|highway|pedestrian|track/.test(id))p['line-color']=C.roadMinor;
    }else if(l.type==='symbol'){
      p['text-color']=C.text;p['text-halo-color']=C.halo;p['text-halo-width']=1.6;
    }
  });
  return st;
}

// ---- własne ikony miejsc (rysowane kodem, w stylu map z gier) ----
var ICON_OF={shop:'basket',grocery:'basket',clothing_store:'shirt',fast_food:'burger',restaurant:'fork',cafe:'cup',bar:'glass',fuel:'pump',bank:'dollar',atm:'dollar',hospital:'cross',pharmacy:'cross',parking:'P',lodging:'bed',school:'book',college:'book',library:'book',post:'mail',police:'shield',cinema:'star',theatre:'star',museum:'star'};
function drawIcon(key,size){
  var cv=document.createElement('canvas');cv.width=cv.height=size;var x=cv.getContext('2d');var k=size/24;x.scale(k,k);
  x.fillStyle='#2a2018';x.strokeStyle='#f1e3c4';x.lineWidth=1.3;x.beginPath();x.arc(12,12,11,0,6.2832);x.fill();x.stroke();
  x.fillStyle='#f1e3c4';x.strokeStyle='#f1e3c4';x.lineWidth=1.7;x.lineCap='round';x.lineJoin='round';
  var F=function(d){x.fill(new Path2D(d))},S=function(d){x.stroke(new Path2D(d))};
  x.save();x.translate(12,12);x.scale(.62,.62);x.translate(-12,-12);
  if(key==='basket'){F('M3 10h18l-2.2 10H5.2z');S('M7 10l3-6M17 10l-3-6')}
  else if(key==='shirt')F('M8 4L2 8l3 4 2.5-1.5V21h9V10.5L19 12l3-4-6-4c-1 2.5-7 2.5-8 0z');
  else if(key==='burger'){F('M3 11a9 7 0 0 1 18 0z');F('M3 12.5h18v2.2H3z');F('M4 16h16v1a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z')}
  else if(key==='fork'){S('M7 3v18M4 3v5a3 3 0 0 0 6 0V3');S('M17 3c-3 2-3 8 0 10v8')}
  else if(key==='cup'){F('M4 7h12v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z');S('M16 9h2a2.5 2.5 0 0 1 0 5h-2')}
  else if(key==='glass'){F('M4 4h16l-8 9z');S('M12 13v7M7 20h10')}
  else if(key==='pump'){F('M5 4h9v17H5z');S('M14 8h3a2 2 0 0 1 2 2v7a1.8 1.8 0 0 0 3.6 0V9L19 5')}
  else if(key==='cross')F('M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z');
  else if(key==='bed'){S('M3 6v14M3 15h18v5M21 15v-3a3 3 0 0 0-3-3h-8v6');F('M5.5 11.5a2.2 2.2 0 1 0 .01 0z')}
  else if(key==='book'){F('M1 9l11-5 11 5-11 5z');S('M6 13v5c3 3 9 3 12 0v-5')}
  else if(key==='mail'){F('M3 6h18v13H3z');x.strokeStyle='#2a2018';S('M3 6l9 7 9-7')}
  else if(key==='shield')F('M12 2l8 3v7c0 5-3.5 8-8 10-4.5-2-8-5-8-10V5z');
  else if(key==='star')F('M12 2l3 6.5 7 .9-5 4.9 1.3 7L12 18l-6.3 3.3 1.3-7-5-4.9 7-.9z');
  else if(key==='gem'){F('M6 4h12l5 6-11 11L1 10z');x.strokeStyle='#2a2018';S('M1 10h22M9 4l-2 6 5 11 5-11-2-6')}
  else if(key==='dollar'||key==='P'){x.restore();x.save();x.fillStyle='#f1e3c4';x.font='bold 15px Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(key==='P'?'P':'$',12,13)}
  x.restore();
  return x.getImageData(0,0,size,size);
}
var POI_CLASSES=Object.keys(ICON_OF);
function addPoiLayer(st){
  var src=null,font=['Noto Sans Regular'];
  Object.keys(st.sources).forEach(function(k){if(!src&&st.sources[k].type==='vector')src=k});
  st.layers.forEach(function(l){
    if(l['source-layer']==='poi'||/^poi/.test(l.id)){l.layout=l.layout||{};l.layout.visibility='none'}
    if(l.type==='symbol'&&l.layout&&l.layout['text-font']&&!font.custom){font=l.layout['text-font'];font.custom=true}
  });
  if(!src)return st;
  var f=[];font.forEach(function(x){f.push(x)});
  var m=['match',['get','class']];
  POI_CLASSES.forEach(function(c){m.push(c,'ic-'+ICON_OF[c])});
  m.push('ic-basket');
  st.layers.push({id:'poi-gta',type:'symbol',source:src,'source-layer':'poi',minzoom:14.5,
    filter:['in',['get','class'],['literal',POI_CLASSES]],
    layout:{'icon-image':['case',['==',['get','subclass'],'jewelry'],'ic-gem',m],
      'icon-size':.55,'icon-allow-overlap':false,'icon-padding':6,'text-field':['coalesce',['get','name:pl'],['get','name']],'text-font':f,'text-size':10,'text-anchor':'top','text-offset':[0,1.3],'text-optional':true,'text-max-width':7},
    paint:{'text-color':C.text,'text-halo-color':C.halo,'text-halo-width':1.5}});
  return st;
}
function startMap(st){
  map=new maplibregl.Map({container:'map',style:st,center:[19.94,50.06],zoom:13,pitch:0,bearing:0,attributionControl:{compact:true},maxPitch:70});
  map.on('styleimagemissing',function(e){if(e.id.indexOf('ic-')===0){try{map.addImage(e.id,drawIcon(e.id.slice(3),96),{pixelRatio:2})}catch(_){}}});
  initMap();
}
fetch('https://tiles.openfreemap.org/styles/liberty').then(function(r){return r.json()}).then(function(st){startMap(addPoiLayer(recolor(st)))}).catch(function(){startMap(style)});
var $=function(id){return document.getElementById(id)};

var meMarker=null,wpMarker=null,me=null,heading=0,follow=true,tilted=false,dest=null,route=null,stepIdx=0,voiceOn=true,lastReroute=0,mapReady=false;
function initMap(){
window.setDest=function(ll,n){return setDestImpl(ll,n)};
// marker gracza (żółta strzałka)
var meEl=document.createElement('div');meEl.className='me';
meEl.innerHTML='<svg viewBox="0 0 34 34" width="34" height="34"><path d="M17 2 L29 30 L17 24 L5 30 Z" fill="#f1e3c4" stroke="#2a2018" stroke-width="2.5" stroke-linejoin="round"/></svg>';
meMarker=new maplibregl.Marker({element:meEl,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat([19.94,50.06]).addTo(map);

map.on('load',function(){
  mapReady=true;
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-case',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#3a0d08','line-width':['interpolate',['linear'],['zoom'],10,6,18,18]}});
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':C.wp,'line-width':['interpolate',['linear'],['zoom'],10,3,18,10]}});
});

// GPS
function onPos(p){
  var c=p.coords;me=[c.longitude,c.latitude];
  if(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>1)heading=c.heading;
  meMarker.setLngLat(me);meMarker.setRotation(heading);
  $('spd').textContent=Math.round((c.speed||0)*3.6);
  if(follow&&mapReady){map.easeTo({center:me,bearing:tilted?heading:map.getBearing(),duration:900,zoom:Math.max(map.getZoom(),tilted?16:14.5)})}
  if(route)updateNav();
}
function gpsErr(e){$('hint').textContent='GPS niedostępny: '+(e.code===1?'zezwól na lokalizację w ustawieniach przeglądarki':e.message)}
if('geolocation' in navigator){navigator.geolocation.watchPosition(onPos,gpsErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
else $('hint').textContent='Ta przeglądarka nie ma GPS';
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}

// przyciski boczne
$('follow').onclick=function(){follow=!follow;this.classList.toggle('on',follow);if(follow&&me)map.easeTo({center:me,duration:600})};
map.on('dragstart',function(){if(follow){follow=false;$('follow').classList.remove('on')}});
$('tilt').onclick=function(){tilted=!tilted;this.classList.toggle('on',tilted);map.easeTo({pitch:tilted?60:0,bearing:tilted?heading:0,zoom:Math.max(map.getZoom(),tilted?16:13),duration:700})};
$('north').onclick=function(){map.easeTo({bearing:0,duration:500})};

// cel: długie przytrzymanie
map.on('contextmenu',function(e){setDestImpl([e.lngLat.lng,e.lngLat.lat],'Wybrany punkt')});
var pressT=null;
map.on('touchstart',function(e){if(e.points&&e.points.length>1)return;pressT=setTimeout(function(){setDestImpl([e.lngLat.lng,e.lngLat.lat],'Wybrany punkt')},650)});
['touchend','touchmove','touchcancel','dragstart','zoomstart'].forEach(function(n){map.on(n,function(){clearTimeout(pressT)})});

function setDestImpl(ll,name){
  dest=ll;$('hint').style.display='none';$('results').hidden=true;
  if(wpMarker)wpMarker.remove();
  var el=document.createElement('div');el.className='wp';
  wpMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(ll).addTo(map);
  if(!me){$('hint').style.display='';$('hint').textContent='Czekam na GPS, aby wyznaczyć trasę…';map.easeTo({center:ll,zoom:15});return}
  getRoute();
}
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+' km':Math.round(m/10)*10+' m'}
function fmtTime(s){var m=Math.round(s/60);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'}
function hav(a,b){var R=6371000,t=Math.PI/180,dLa=(b[1]-a[1])*t,dLo=(b[0]-a[0])*t,x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(x))}

function hintMsg(t){$('hint').style.display='';$('hint').textContent=t}
function getRoute(){
  if(!me||!dest)return;
  lastReroute=Date.now();
  var q=me[0]+','+me[1]+';'+dest[0]+','+dest[1]+'?overview=full&geometries=geojson&steps=true';
  var servers=['https://router.project-osrm.org/route/v1/driving/','https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
  var err='';
  (function tryNext(i){
    if(i>=servers.length){hintMsg('Brak trasy: '+err);return}
    fetch(servers[i]+q).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
      if(!j.routes||!j.routes.length){err=(j.code||'')+' '+(j.message||'');tryNext(i+1);return}
      route=j.routes[0];stepIdx=0;spoken=-1;
      map.getSource('route').setData({type:'Feature',geometry:route.geometry});
      $('nav').style.display='block';$('hint').style.display='none';
      var b=new maplibregl.LngLatBounds();route.geometry.coordinates.forEach(function(c){b.extend(c)});
      if(!tilted&&!follow)map.fitBounds(b,{padding:{top:90,bottom:200,left:40,right:70},duration:800});
      updateNav(true);
    }).catch(function(e){err=e.message;tryNext(i+1)});
  })(0);
}
var PL={'turn':'Skręć','new name':'Jedź prosto','depart':'Ruszaj','arrive':'Cel osiągnięty','merge':'Włącz się','on ramp':'Wjedź na wjazd','off ramp':'Zjedź','fork':'Na rozwidleniu','end of road':'Na końcu drogi skręć','continue':'Jedź prosto','roundabout':'Rondo','rotary':'Rondo','roundabout turn':'Na rondzie skręć','notification':'Jedź dalej'};
var DIR={'left':'w lewo','right':'w prawo','slight left':'lekko w lewo','slight right':'lekko w prawo','sharp left':'ostro w lewo','sharp right':'ostro w prawo','straight':'prosto','uturn':'zawróć'};
function stepText(s){
  var m=s.maneuver,t=PL[m.type]||'Jedź',d=DIR[m.modifier]||'';
  if(m.type==='arrive')return 'Cel osiągnięty';
  if(m.type==='roundabout'||m.type==='rotary')return 'Rondo: zjazd '+(m.exit||'')+(s.name?' → '+s.name:'');
  if(m.modifier==='uturn')return 'Zawróć'+(s.name?' na '+s.name:'');
  var txt=(m.type==='turn'||m.type==='end of road'||m.type==='fork'||m.type==='merge'||m.type==='off ramp'||m.type==='on ramp')?t+' '+d:t;
  return txt+(s.name?' → '+s.name:'');
}
var spoken=-1;
function updateNav(force){
  if(!route||!me)return;
  var steps=route.legs[0].steps;
  // najbliższy punkt manewru
  while(stepIdx<steps.length-1&&hav(me,steps[stepIdx].maneuver.location)<25&&steps[stepIdx].maneuver.type!=='depart')stepIdx++;
  var next=steps[Math.min(stepIdx+(steps[stepIdx].maneuver.type==='depart'?1:0),steps.length-1)];
  var dm=hav(me,next.maneuver.location);
  $('step').textContent=(next.maneuver.type==='arrive'?'':'Za '+fmtDist(dm)+': ')+stepText(next);
  // pozostały dystans (przybliżony: proste odcinki po geometrii od najbliższego punktu)
  var cs=route.geometry.coordinates,bi=0,bd=1e12;
  for(var i=0;i<cs.length;i+=1){var d=hav(me,cs[i]);if(d<bd){bd=d;bi=i}}
  var rem=bd;for(var k=bi;k<cs.length-1;k++)rem+=hav(cs[k],cs[k+1]);
  $('dist').textContent=fmtDist(rem);
  var secs=route.duration*(rem/route.distance);
  var eta=new Date(Date.now()+secs*1000);
  $('eta').textContent=fmtTime(secs)+' · '+('0'+eta.getHours()).slice(-2)+':'+('0'+eta.getMinutes()).slice(-2);
  if(voiceOn&&dm<150&&spoken!==stepIdx){spoken=stepIdx;speak('Za '+Math.round(dm/10)*10+' metrów, '+stepText(next))}
  if(next.maneuver.type==='arrive'&&rem<30){speak('Dotarłeś do celu');cancelRoute();return}
  if(bd>80&&Date.now()-lastReroute>8000)getRoute();
}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function cancelRoute(){route=null;dest=null;spoken=-1;if(wpMarker){wpMarker.remove();wpMarker=null}map.getSource('route').setData({type:'FeatureCollection',features:[]});$('nav').style.display='none'}
$('cancel').onclick=cancelRoute;
$('voice').onclick=function(){voiceOn=!voiceOn;this.textContent='Głos: '+(voiceOn?'wł.':'wył.');if(voiceOn)speak('Głos włączony')};

// wyszukiwarka (Nominatim)
function showResults(items){
  var box=$('results');box.innerHTML='';box.hidden=false;
  if(!items.length){box.innerHTML='<button>Nic nie znaleziono</button>';return}
  items.forEach(function(x){
    var b=document.createElement('button');b.textContent=x.name;
    b.onclick=function(){$('q').blur();box.hidden=true;follow=false;$('follow').classList.remove('on');if(map)map.easeTo({center:[x.lon,x.lat],zoom:15});window.setDest&&window.setDest([x.lon,x.lat],x.name)};
    box.appendChild(b);
  });
}
function search(){
  var q=$('q').value.trim();if(!q)return;
  $('q').blur();
  var box=$('results');box.hidden=false;box.innerHTML='<button>Szukam…</button>';
  var pu='https://photon.komoot.io/api/?limit=7&q='+encodeURIComponent(q);
  if(me)pu+='&lat='+me[1]+'&lon='+me[0];
  else{var c=map?map.getCenter():null;if(c)pu+='&lat='+c.lat+'&lon='+c.lng}
  fetch(pu).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    if(!j.features.length)throw new Error('empty');
    showResults(j.features.map(function(f){var p=f.properties;return{name:[p.name,[p.street,p.housenumber].filter(Boolean).join(' '),p.city||p.county,p.country].filter(Boolean).join(', '),lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}}));
  }).catch(function(){
    var u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=pl&q='+encodeURIComponent(q);
    fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(list){
      showResults(list.map(function(x){return{name:x.display_name,lon:+x.lon,lat:+x.lat}}));
    }).catch(function(e){box.innerHTML='<button>Błąd wyszukiwania: '+(e.message||'brak internetu')+'</button>'});
  });
}
$('go').addEventListener('click',function(e){e.preventDefault();search()});
$('q').form;
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')search()});
</script>
